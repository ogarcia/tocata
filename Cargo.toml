[package]
name = "tocata"
version = "0.1.0"
edition = "2024"
description = "An OpenSubsonic compatible music server"
authors = ["Óscar García Amor <ogarcia@connectical.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ogarcia/tocata"
readme = "README.md"
keywords = ["opensubsonic", "music", "server", "audio", "streaming"]
categories = ["multimedia::audio", "web-programming::http-server"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
