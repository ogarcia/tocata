[package]
name = "tocata"
version = "0.1.0"
edition = "2024"
description = "An OpenSubsonic compatible music server"
authors = ["Óscar García Amor <ogarcia@connectical.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/ogarcia/tocata"
readme = "README.md"
keywords = ["opensubsonic", "music", "server", "audio", "streaming"]
categories = ["multimedia::audio", "web-programming::http-server"]

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
lofty = "0.24"
mime = "0.3"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_html_form = "0.4"
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "macros", "migrate", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
