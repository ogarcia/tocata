<!-- Tabler's heart, filled: the same path as heart.svg with the stroke kept and
     the inside painted. Not Tabler's own heart-filled, which is a different and
     slightly larger outline — with this one the filled and the outlined heart have
     exactly the same edge, so pressing the button changes a colour and nothing
     moves. Same arrangement as play-solid.svg beside play.svg. -->
