# The base language. Every key exists here first, and a translation missing
# anywhere else falls back to what this file says.
#
# One file per language rather than one file holding every language, because that
# is the shape translation tools expect to be handed.
_version: 1

app:
  name: Tocata

nav:
  profile: "Profile"
  access: "Access"
  preferences: "Preferences"
  home: Overview
  collection: Collection
  tracks: Tracks
  albums: Albums
  artists: Artists
  genres: Genres
  yours: Yours
  playlists: Playlists
  favourites: Favourites
  server: The server
  libraries: Libraries
  accounts: Accounts
  settings: Settings
  maintenance: Maintenance
  menu: Menu

login:
  heading: "Log in"
  lead: "With the account the server was set up with, or one an administrator made for you."
  claim: "Your records, where you left them."
  username: "Username or email"
  password: Password
  remember: "Keep me logged in on this browser"
  forgotten: "Forgotten your password? An administrator sets a new one for you — the server cannot email it."
  submit: Log in
  working: Working…
  failed: That username and password do not go together
  # A server that broke is not a password that is wrong. Without saying what broke:
  # nobody has got in yet.
  server_wrong: "The server could not deal with the request. Try again in a moment."
  too_many: "Too many failed attempts from here. Wait a little before trying again."
  unreachable: The server did not answer

header:
  administrator: administrator
  listener: listener
  log_out: Log out

looks:
  auto: Automatic
  light: Light
  dark: Dark

home:
  greeting: Hello, %{name}
  scanned: Scanned %{when}. Nothing running.
  while_scanning: A scan is running. Its detail is in the sidebar.
  never_scanned: Never scanned. Nothing running.
  last_scan_when: Last scan · %{when}
  songs: Songs
  albums: Albums
  artists: Artists
  genres: Genres
  collection: The collection
  server: The server
  size: Size
  duration: Length
  playlists: Playlists
  attention: Needing attention
  version: Version
  last_scan: Last scan
  libraries: Libraries
  accounts: Accounts
  keys: API keys
  database: Database
  process: The process
  processor: Processor
  memory: Memory
  cores: of %{count} cores
  of_total: of %{total}

# The collection, listed. Both spellings of every count are written out because
# rust-i18n interpolates and does not pluralise, and a collection of one track is
# what somebody sees the first time they try Tocata on a single directory.
tracks:
  search: Search tracks
  title: Title
  artist: Artist
  album: Album
  genre: Genre
  length: Length
  # After whoever made it, which is the line in a row with room for a clause.
  missing: file missing
  one: One track
  many: "%{count} tracks"
  none_found: Nothing here matches what you typed.

# One track's own panel, opened by pressing its row. Singular on purpose: the block
# above is the screen that lists them, this one is the thing itself.
#
# Every name here labels a row that only appears when there is something to put in
# it, so none of them ever stands over a dash.
track:
  said: What it says
  words: Lyrics
  every_tag: "Every tag · %{count}"
  the_recording: The recording
  title: Title
  artist: Artist
  album: Album
  album_artist: Album artist
  track: Track
  # Its own row and not sharing one with the track, because most records came on one
  # disc and this row is not there at all for them.
  disc: Disc
  nth_of: "%{nth} of %{held}"
  year: Year
  genre: Genre
  the_file: The file
  length: length
  format: format
  bitrate: bitrate
  # Whichever of the two the file reported. An MP3 has no bit depth, so most files in
  # most collections are the first of these.
  khz: kHz
  bits: bits
  khz_bits: kHz / bits
  where: Where it is
  library: Library
  size_read: "Size · read"
  identifiers: Identifiers
  isrc: ISRC
  musicbrainz: MusicBrainz
  comment: Comment
  # Not in the drawings, and the panel would be dishonest without it: this is the one
  # row in a listing somebody opens because something is wrong with it.
  file_gone: Its file is not where it was, so there is nothing to read out of it and nothing to play.
  copy: Copy
  # Short enough for one line beside the actions. The three of these sit in the same
  # place and say where what you are reading came from, so a wrap in one of them is a
  # foot that changes height with the tab.
  from_the_scan: What the last scan read.
  from_the_file: Read from the file, not the database.
  from_beside: Read from a file beside the music.
  looked_in_both: Looked for in the file and beside it.
  # Where the words came from, which is the point of showing them in an
  # administration panel: a song whose sidecar and whose tag disagree is worth
  # knowing about.
  beside_the_file: "From %{name} beside the music"
  in_the_frame: "From the %{frame} frame in the file"
  timed: timed
  untimed: not timed
  one_line: 1 line
  many_lines: "%{count} lines"
  # A stretch of the song the words leave empty, which is worth saying: a blank row
  # reads as the end of them rather than as a break in them.
  instrumental: Instrumental
  no_words: No lyrics in this file.
  where_it_looked: Tocata reads the tag frames of the file itself and, failing that, an .lrc or .txt of the same name beside it. It looks nowhere else and asks nobody.
  expected: Looked for
  # No date for when it last looked, because nothing looks ahead of being asked. That
  # there is no scan to wait for is the whole of what this sentence says.
  put_them_there: Put the words in either place and they are there the next time you look.
  as_written: "Every tag Tocata could read, spelt as %{kind} spells them. Not every byte of the tag: a frame this reader has never heard of does not arrive at all, so there is no counting what was left behind."

# One record's own panel. Singular, like the block for a track: the plural block above
# is the shelf that lists them.
album:
  the_album: The album
  tracks: tracks
  length: length
  year: year
  on_disc: on disc
  artist: Album artist
  genre: Genre
  label: Label
  discs: Discs
  where: Where it is
  library_read: "Library · read"
  running_order: Tracks
  disc: "Disc %{nth}"
  a_title_opens_it: A title opens what is known about that track.
  who_plays: Who plays on it
  # Said because it is not a lookup and not a guess: it is the artist tag of each of
  # its own files, which is why a record can list people its sleeve does not.
  from_the_tags: Taken from the artist tags of its own tracks, not from a lookup.
  # A file that has gone, said on a line of its own rather than folded into the
  # figures: a record missing four of its files is not a record with four fewer tracks.
  one_gone: One of its files is not where it was. It is still in the running order below.
  many_gone: "%{count} of its files are not where they were. They are still in the running order below."
  pause_record: Pause
  one_file: One file in one directory.
  many_files: "%{count} files in one directory."

albums:
  search: Search albums
  one: One album
  many: "%{count} albums"
  none_found: No record here matches what you typed.
  playing: playing

# One artist's own panel. The only one of the three with nothing of its own on disk: an
# artist is not a file and not a directory, so there is no path and no size, and what
# is worth showing instead is what they amount to here.
artist:
  albums: albums
  tracks: tracks
  length: length
  plays: plays
  genre: Genre
  one_track_in: "1 track in %{albums} albums"
  many_tracks_in: "%{count} tracks in %{albums} albums"
  played_most: Played most
  # Whose plays these are, which is worth saying on a server other people listen to.
  across_everyone: Counted across everybody who listens here, not only you.
  one_play: 1 play
  many_plays: "%{count} plays"
  records: Records
  one_missing: 1 missing
  many_missing: "%{count} missing"
  play_everything: Play everything
  # What "theirs" means, and it is not what the drawings said: every track that credits
  # them, guest appearances included, which is what the listing counts as well.
  credited_on: Every record they are credited on.
  picture_by: "Picture by %{author},"
  picture_from: "Picture from"
  on_commons: "Wikimedia Commons"

artists:
  search: Search artists
  one: One artist
  many: "%{count} artists"
  none_found: Nobody here matches what you typed.

# A genre's own panel: its figures, and the songs wearing it.
genre:
  albums: albums
  tracks: tracks
  length: length
  plays: plays
  one_track_by: "1 track by %{artists} artists"
  many_tracks_by: "%{count} tracks by %{artists} artists"
  one_gone: One of the files wearing it is not there.
  many_gone: "%{count} of the files wearing it are not there."
  what_wears_it: What wears it
  a_title_opens_it: Press one to see what is known about it.
  # Where a genre comes from, which is not a decision this server made.
  from_the_tags: Spelt the way the files' own tags spell it.
  play_everything: Play all of it

# The lists somebody made. A list is private or public to everybody on the server and
# nothing in between: what is not yours can be read and played, and nothing else.
playlists:
  new: New playlist
  new_lead: It starts empty. Add to it from the collection, or by saving the queue.
  name: Name
  make: Make it
  one: One playlist
  many: "%{count} playlists"
  # The two headings. The first only appears when there is a second group to tell it
  # from.
  mine: Yours
  public: Public on this server
  # The visibility column, drawn only when it is public: private is what a list is
  # until somebody says otherwise.
  is_public: Public
  is_private: Private
  public_note: Every account on this server can see it.
  private_note: Only you can see it.
  # The picker, opened from the foot of a drawer.
  add_to: Add to a playlist
  add_lead: It goes at the end of whichever you choose.
  # The receipt: it names the list, which is the one thing somebody just chose and the one
  # thing they can get wrong. Closing the sheet says none of that.
  added_to: "Added to %{name}"
  saved_as: "Saved as %{name}"
  in_one: In one of your lists
  in_many: "In %{count} of your lists"
  already_in: already in it
  new_holding: It will hold what you are adding.
  none_to_add_to: You have not made a list yet. Make one holding this.
  # At the foot of the queue.
  save_queue: Save as a playlist
  save_queue_lead: It will hold what is in the queue, in this order.
  clear_queue: Empty the queue
  doings: What to do with this list
  make_public: Make it public
  make_private: Make it private
  duplicate: Duplicate it
  # What a copy is called. Named here and not on the server, which speaks no language.
  copy_of: "%{name} (copy)"
  delete: Delete the list
  # The confirmation. Nothing to type, unlike an account's: what is lost is a handful of
  # rows somebody can gather again, not the history of a person.
  delete_this: "Delete %{name}?"
  delete_private: "A private list %{held} goes. It cannot be undone."
  delete_public: "A public list %{held} goes. It cannot be undone."
  # What is in it, preposition and all, because it goes inside the two sentences above
  # and "with no tracks" reads as a count rather than as an empty list.
  holds_none: with nothing in it
  holds_one: with one track
  holds_many: "with %{count} tracks"
  delete_yes: Delete it
  # On the screen of one list.
  play: Play
  # At the foot of the panel: whose list this is, the one fact about it not on a row.
  yours: A list of yours
  made_by: "A list of %{who}'s"
  reorder: Hold to move it
  take_out: Take it out of the list
  changed: "changed %{when}"
  saved_as_you_go: Changes save as you make them.
  will_be_skipped: the file is gone, it will be skipped
  one_missing: One of its tracks has lost its file
  many_missing: "%{count} of its tracks have lost their files"
  # The empty states: no lists at all, and a list with nothing in it.
  none_yet: You have not made a playlist yet.
  none: You have not made a playlist yet.
  whence: Make an empty one and add to it from the collection, or play something you like and save the queue.
  empty: There is nothing in this list.
  fill_it: Add tracks from the collection, or play something and save the queue.

# What you have marked, as three listings that are the collection narrowed to yours.
# The "Marked" column stands where the genre does: when you marked something is the one
# thing this screen knows that the others do not.
favourites:
  search: Search what is yours
  marked: Marked
  # The heart at the foot of a drawer. The same button serves a track, a record and a
  # name, so it says neither which nor what it is called.
  mark: Add to favourites
  unmark: Take out of favourites
  # With nothing marked at all, on the line under the title.
  none_at_all: You have not marked anything yet.
  no_tracks: You have not marked a track.
  no_albums: You have not marked an album.
  no_artists: You have not marked an artist.
  # Where marks come from today, which is the question that emptiness raises. The panel
  # does not mark anything yet, and saying where it can be done beats saying nothing.
  whence: Anything you star from an OpenSubsonic client turns up here.
  none_found: Nothing you have marked matches what you typed.

genres:
  search: Search genres
  one: One genre
  many: "%{count} genres"
  none_found: No genre here matches what you typed.

# What the four listings share. At the foot of every one of them, beside the
# turning glyph, while more of it is on its way.
# Why a listing has nothing in it, which is never one answer. Four states needing four
# different things done about them, and a single "nothing found" would be the panel
# knowing which and not saying.
empty:
  # A search that narrowed too far. The reassurance matters more than the news: what
  # somebody fears is that the list lost something, and it did not.
  no_track_matches: No track matches what you typed.
  no_album_matches: No record matches what you typed.
  no_artist_matches: Nobody matches what you typed.
  no_genre_matches: No genre matches what you typed.
  tracks_still_there: "All %{count} tracks are still there. Only the list is narrowed."
  albums_still_there: "All %{count} records are still there. Only the list is narrowed."
  artists_still_there: "All %{count} names are still there. Only the list is narrowed."
  genres_still_there: "All %{count} genres are still there. Only the list is narrowed."
  clear_the_search: Clear the search
  # A collection with music in it and none of this kind, which is a fact about the tags
  # rather than about the music. Nothing to press: the fix is not in here.
  no_tracks: Nothing has a title.
  no_albums: No file says what record it is off.
  no_artists: No file says who made it.
  no_genres: None of the files say what they are.
  outside_tocata: Tocata reads what the files carry and adds nothing of its own, so this is a question for whatever tagged them. Fix the tags and the next scan picks it up.
  tracks_read: Tracks read
  with_a_title: With a title
  with_an_album: With an album tag
  with_an_artist: With an artist tag
  with_a_genre: With a genre tag
  # There is music here and none of it is theirs to see.
  all_switched_off: Every library is switched off.
  switch_one_back_on: There is music on this server and nothing is being read, because every library it was given is off. Switch one back on and it appears here — nothing has to be scanned again.
  nothing_you_reach: Nothing here is yours to see.
  ask_an_administrator: There is music on this server, and your account has not been given a library it can read — or the ones it was given are switched off. Whoever runs the server can change that.
  # The first run, and the only empty state with something to press.
  nothing_yet: Nothing has been read yet.
  nothing_added_yet: Nothing has been added to this server yet. Whoever runs it adds a library and scans it, and it appears here.
  no_libraries: There are no libraries yet. A library is a directory to read music out of, and nothing is read until there is one.
  one_library: "There is one library, %{path}, and it has never been read. A scan walks it and puts what it finds here."
  many_libraries: "There are %{count} libraries and not all of them have been read. A scan walks what is left and puts what it finds here."
  one_library_read: "There is one library, %{path}, and reading it found nothing. Either it does not point where the music is, or what is in there is not audio Tocata can read."
  many_libraries_read: "There are %{count} libraries and reading them found nothing. Either they do not point where the music is, or what is in them is not audio Tocata can read."
  scan_now: Scan now
  scanning: Scanning…

collection:
  stopped_at: "Could not read past the first %{shown}."
  try_again: Try again
  reading: "Reading more · %{shown} of %{total}"
  # How much of something there is, counted in the two things a collection is
  # counted in. On a record's third line and at the end of an artist's row.
  one_track: "1 track"
  many_tracks: "%{count} tracks"
  one_album: "1 album"
  many_albums: "%{count} albums"
  # The third, for the line that adds all three up. A figure like the other two: in
  # "2 tracks · 1 album · one artist" the one written out is the one that shows.
  one_artist: "1 artist"
  many_artists: "%{count} artists"

# The player at the foot of the sidebar, and the buttons that fill it.
player:
  loading: Reading it…
  previous: Previous
  toggle: Play or pause
  next: Next
  queued: How many are queued
  play_this: Play this
  # What the same button offers while something is already sounding, and what it
  # says for a moment after doing it.
  queue_this: Queue this
  queued_it: Added to the queue
  play_record: Play this record
  open: What is playing
  # The three things the player says, and the three panels each of them opens. The
  # cover only where it is not already being looked at, which is the phone.
  this_cover: The cover, larger
  this_track: What this track is
  this_artist: Who is playing it
  from: "From %{album}"
  kbps: "%{rate} kbps"
  seek: Move about in the track

# What is coming after this. Both spellings of the count, because rust-i18n does not
# pluralise and the last track in a queue is the common case.
queue:
  heading: Queue
  playing: Playing
  next: Next
  one_ahead: "1 track ahead"
  many_ahead: "%{count} tracks ahead"
  one_beyond: One more is waiting past these. It appears as the queue moves on.
  many_beyond: "%{count} more are waiting past these. They appear as the queue moves on."
  nothing_ahead: Nothing after this one.
  drop: Take it out of the queue
  reorder: Hold to move it
  shuffle: Shuffle
  shuffling: Mix what is coming
  ordering: Put it back in order

# How long ago. A section of its own because half the panel says it: library rows,
# key rows, session rows and the last scan. The short ones are for a figure
# standing over its label, where the "ago" is already understood.
ago:
  moments: just now
  minutes: "%{count} min ago"
  hours: "%{count} h ago"
  days: "%{count} d ago"
  just_now: now
  short_minutes: "%{count} min"
  short_hours: "%{count} h"
  short_days: "%{count} d"

scan:
  start: Scan
  quick: Quick scan
  quick_note: Skips what has not changed
  start_full: Read everything again
  full_note: Reads every file again
  running: Scanning
  never: Never scanned
  cancelled: Cancelled
  cancel: Cancel
  folders: Folders
  added: Added
  unchanged: Unchanged
  failed: Unreadable
  gone: Gone missing

libraries:
  lead_sheet: A directory on the server. Nothing is read until you scan.
  remove_this: "Remove \"%{name}\"?"
  remove_note: The library goes, and everything scanned from its directory. It cannot be undone.
  heading: Libraries
  missing: "%{count} missing"
  on: "On"
  off: "Off"
  edit: Edit
  move_note: "Moving it takes effect at once and needs no scan: everything is stored relative to this directory."
  lead: The directories the music is read from.
  add: Add a library
  path: Path
  path_note: An absolute path to a directory on the server
  name: Name
  name_default: The name of the directory
  none: No libraries yet
  enable: Switch on
  disable: Switch off
  remove: Remove
  remove_yes: Remove
  disable_first: Switch it off before removing it
  bad_path: That path is not a directory on the server
  already: "That directory is already a library, is inside one, or holds one"

accounts:
  add_lead: "They can sign in straight away. Which libraries they may reach is set afterwards, if it needs setting."
  heading: Accounts
  wrong_password: "That is not your current password"
  sessions_short: "Sessions"
  keys_short: "Keys"
  remove: "Delete the account"
  remove_note: "Takes the account and everything only it had: its sessions, its keys, its favourites, ratings, play counts, playlists and bookmarks."
  lead: Who can reach the collection.
  add: Add an account
  username: Username
  password: Password
  email: Email address
  is_admin: Administers the server
  no_email: No email address
  all: All accounts
  who: The account
  new_password: New password
  unchanged: Leave empty to keep it
  access: Access
  closed: "%{count} sessions closed"
  revoked: "%{count} keys revoked"
  reach: Libraries
  taken: That name is taken
  invalid: Something in there is not valid
  not_allowed: The server would not allow that

  # The listing: one row per account, yours first.
  search: "Search accounts"
  none_found: "No account matches that"
  role: "Role"
  last_seen: "Last seen"
  never_seen: "never"
  sessions_keys: "Sessions · keys"
  administrator: "Administrator"
  listener: "Listener"
  you: "you"
  every_library: "every library"
  some_libraries: "%{some} of %{all} libraries"
  one_account: "One account"
  many_accounts: "%{count} accounts"
  one_admin: "one administrator"
  many_admins: "%{count} administrators"
  name_opens: "A name opens the account."
  # A row's menu. Yours points at your own screens; anybody else's acts.
  more: "More for %{name}"
  open: "Open the account"
  my_access: "Your keys and sessions"
  set_password: "Set a new password…"
  make_admin: "Make an administrator"
  make_listener: "Make a listener"
  close_theirs: "Close their sessions"
  revoke_theirs: "Revoke their keys"
  remove_menu: "Delete the account…"
  remove_yes: "Delete it"
  favourites: "Favourites"
  ratings: "Ratings"
  plays: "Plays"
  playlists: "Playlists"
  bookmarks: "Bookmarks"
  holds_nothing: "Nothing else hangs off this account."
  remove_this: "Delete %{name}'s account?"
  type_name: "Type %{name} to confirm"
  password_lead: "They are not told: tell them yourself. Changing it closes their panel sessions."
  password_done: "New password for %{name}"
  now_admin: "%{name} now administers the server"
  now_listener: "%{name} no longer administers the server"
  removed: "%{name} is gone"

  # Administering somebody else's account. In the third person, and with nothing
  # that is the owner's alone: not their keys, not their sessions, not what they do
  # with what they listen to.
  admin_warning: "An administrator can reach every library and every account, yours included."
  set_password_row: "Set a new password"
  reach_heading: "What they may reach"
  reach_note: "Tick every library to lift the restriction altogether; a library switched off later is out of reach for everybody."
  added_when: "added %{day}"
  seen_when: "last seen %{when}"
  never_seen_long: "never used yet"
  password_set: "Password set"
  cutting_note: "Closing sessions logs them out of the panel everywhere. Revoking keys stops the clients that play their music."

keys:
  issue_lead: "For a client that signs in with a key instead of with your password."
  never: "never"
  heading: "API keys"
  made: "Your new key"
  actions: "Actions"
  rotate: "Rotate"
  lead: "One per client, so that revoking one stops that client alone. A key is shown once, when it is made."
  none: "No keys yet"
  label: "What it is for"
  label_default: "phone"
  issue: "Make a key"
  until: "Expires on"
  until_note: "Left empty it never expires, which is what a music player wants: nothing can renew one for you."
  once: "Copy it now. It is not stored and will not be shown again."
  # The line under a key's name, joined from three of these.
  used: "Used %{when}"
  unused: "Never used"
  forever: "never expires"
  expires: "expires %{day}"
  ran_out: "expired %{day}"
  revoked_when: "revoked %{when}"
  created: "made %{when}"
  dead: "it can no longer play anything"
  is_expired: "expired"
  is_revoked: "revoked"
  # Withdrawing, and then tidying up. Two words on purpose: revoking is what stops
  # a client, and not everybody reads it as the end of the key.
  revoke: "Revoke"
  remove: "Remove"
  revoke_first: "Revoke the key before removing it"
  lost_device: "Losing a device?"
  revoke_all: "Revoke all %{count} keys"
  revoke_all_sure: "Revoke every one of them? There is no way back."
  revoke_all_yes: "Revoke them"

sessions:
  heading: "Panel sessions"
  lead: "Browsers logged in to this panel. Closing one does not stop any music."
  this_browser: "This browser"
  another_browser: "Another browser"
  # A browser and the system under it, which is what a session says it was
  # opened from when nobody has given it a name. Two words the server read off
  # what the browser said about itself, so the sentence has to hold either of
  # them being a name nobody here has heard of.
  browser_on: "%{browser} on %{system}"
  this_one: "you are here"
  since: "Since %{when}"
  seen: "Last seen %{when}"
  expires_on: "expires %{day}"
  close: "Close"
  log_out: "Log out"
  elsewhere: "Somewhere you should not be?"
  close_others: "Close every other session"

# Your own account. Deliberately not sharing a word with `accounts`, which is
# the administrator's vocabulary: the same field means a different thing when it
# is somebody else's, and one of the two changing is not the other changing.
profile:
  where_signed_in: "Where you are signed in"
  panel_sessions: "Panel sessions"
  api_keys: "API keys"
  reach: "Libraries you reach"
  reach_all: "All"
  reach_some: "%{some} of %{all}"
  this_session: "This session since"
  manage_access: "Manage keys and sessions"
  lately: "Lately"
  key_used: "Key \"%{name}\" used"
  key_never_used: "No key used yet"
  password_changed: "Password changed"
  confirm_with_password: "Confirm the changes with your current password"
  email: Email address
  listening: "Listening"
  mismatch: "The two passwords are not the same"
  new_password: New password
  profile_lead: "Who you are on this server."
  repeat_password: "Repeat the new password"
  role: "Role"
  save_changes: "Save the changes"
  scrobbling: Pass plays on
  scrobbling_on: "Pass my plays on"
  scrobbling_why: "Counting them here never stops. This is only about sending them anywhere else."
  # When the whole server is not allowed out. It says whose decision that is, because
  # it is not this reader's unless they also administer the place.
  scrobbling_shut: "This server is not allowed to talk to other servers, so nothing is sent anywhere. An administrator can allow it in Settings, under \"Out to the network\"."
  unchanged: Leave empty to keep it
  username: Username
  username_theirs: "An administrator changes this"
  display_name: "Name to show"
  you: "You"
  # The four figures of what you have here. Written again rather than shared with
  # `accounts`, where they are what deleting somebody else would cost.
  plays: "Plays"
  favourites: "Favourites"
  ratings: "Ratings"
  playlists: "Playlists"

access:
  lead: "A key is how a client plays your music. A session is a browser logged in to this panel. They are separate: revoking one never touches the other."
  keys_in_use: "Keys in use"
  sessions_open: "Sessions open"
  since_used: "Since a key was used"
  since_password: "Since the password changed"
  password: "Your password"
  password_changed: "Changed %{when}"
  change_password: "Change it in Profile"

attention:
  heading: Files needing attention
  lead: "%{count} files the last scan could not account for. Nothing here has been deleted from your disks: Tocata only ever reads them."
  unreadable: "Unreadable · %{count}"
  unreadable_why: "The file is there and Tocata cannot read it, so none of its music is in the collection. Each one says what went wrong, in the words of whatever tried; the next scan tries again on its own."
  failing_since: Failing since %{when}.
  astray: "Gone missing · %{count}"
  astray_why: "The music is still in the collection and the file is no longer where it was. Its ratings, its play counts and its places in playlists are all still here, waiting: put the file back and the next scan picks it up as if nothing happened."
  track: Track
  last_seen: Last seen
  held: Held
  plays: "%{count} plays"
  rated_by: "rated by %{count}"
  in_playlists: "in %{count} playlists"
  held_nothing: nothing
  dropped_in: "dropped in %{count} d"
  dropped_next_scan: dropped on the next scan
  moved: "Moved the collection somewhere else? Scan again before forgetting anything: a file that turns up under a new path stops being missing on its own."
  and_more: and %{count} more

chores:
  lead: "Jobs you run when something is off. Each one says when it last ran and what it found."
  run: "Run it"
  running: "Running…"
  never: "Never run"
  ran: "%{when}"
  lately: "Lately"
  nothing_yet: "Nothing has been run yet."

  # Every job says what it will do, and says it differently when there is nothing
  # to do: "removes the 0 tracks whose files are gone" is not a sentence anybody
  # would write.
  purge: "Clear what is gone"
  purge_why: "Removes the %{count} tracks whose files are no longer on disk. Their ratings and play counts go with them."
  purge_idle: "No track is missing. A scan marks what it cannot find, and this takes away what was marked."
  compact: "Compact the database"
  compact_why: "Gives back the space deletions left behind. The server answers nobody while it runs."
  compact_idle: "Gives back the space deletions left behind. There is none to give back right now."
  covers: "Put the covers in order"
  # Two figures rather than a total: files that are rubbish and answers that are
  # merely old are not the same kind of thing, and adding them together reads as
  # a heap of things wrong with a server where nothing is wrong. Each half is
  # left out when it is nought.
  covers_files: "Deletes the %{count} cover files that belong to nothing any more."
  covers_again: "Looks again in the %{count} albums and artists it found no picture in, in case one has been added since."
  covers_idle: "Deletes covers that belong to nothing any more, and looks again where it found none. Nothing is left over right now."
  forget: "Forget the pictures fetched"
  forget_why: "Throws away the %{count} pictures of artists that came off the network, and the memory of having looked, so they can be looked for again. Having them back means fetching them again: a second each, and only for the artists that had one."
  forget_idle: "Throws away the pictures of artists that came off the network. There are none right now."
  check: "Check the database"
  check_why: "Reads it from end to end and says whether anything is wrong. It changes nothing."

  # What it came to last time, in the terms of each job.
  removed: "removed %{count}"
  forgotten: "forgot %{count}"
  reclaimed: "reclaimed %{size}"
  deleted: "cleared %{count}"
  sound: "nothing wrong"
  problems: "%{count} problems"
  size_and_free: "%{size} · about %{free} to reclaim"
  size_only: "%{size} · nothing to reclaim"

  # The dialogue in front of the one job that cannot be undone.
  purge_this: "Clear what is gone?"
  purge_note: "The missing tracks go, and everything that hung off them alone. It cannot be undone: the only thing that brings them back is their files returning to the disk and a scan finding them."
  nothing_absent: "Nothing is marked as missing."
  purge_yes: "Clear it"
  tracks: "Tracks"
  in_playlists: "In playlists"

portraits:
  title: "Pictures of the artists"
  # What it would do, or what it is doing.
  not_allowed: "Switched off. This server is not asking anybody for anything. The switch is in Settings, under \"Out to the network\"."
  nobody_wanting: "Every artist that could have a picture has one. It looks again in three months for the ones nobody has photographed."
  one_wanting: "One artist is without a picture and carries an identifier to look one up by."
  many_wanting: "%{count} artists are without a picture and carry an identifier to look one up by. About a second each."
  starting: "Starting…"
  looking_at: "Looking up %{artist}…"
  # Where it got to. "found" is properly a small fraction: most artists have no
  # photograph anywhere.
  got_through: "%{done} of %{total} looked up, %{found} found"
  stopped: "stopped"
  start: "Look for them"
  stop: "Stop"

settings:
  lead: "How the server behaves for everybody. Your own look and language are in Preferences."
  scanning: "Scanning"
  at_startup: "On starting"
  at_startup_why: "A quick scan every time the server comes up."
  at_startup_on: "Scan at startup"
  on_a_schedule: "On a schedule"
  on_a_schedule_why: "A quick scan, every day, while nobody is listening."
  every_day: "Every day at"
  what_is_gone: "What is gone"
  keep_it: "Keep it"
  after_a_while: "After a while"
  at_once: "As soon as it goes"
  # What each of the three answers does, in a sentence. It follows the answer,
  # because the three describe different servers.
  gone_kept: "A scan never deletes: it marks what it cannot find, because the usual reason is a disk that failed to mount. They stay that way until you ask for a clear-out."
  gone_at_once: "The scan that finds them gone is the one that removes them, along with their ratings and play counts."
  gone_after: "They stay marked as missing while you look for them. %{after}, a scan removes them, along with their ratings and play counts."
  # The span written out, for that sentence. No plural rule: rust-i18n has none,
  # so each of these is its own key.
  after_a_day: "After a day"
  after_a_week: "After a week"
  after_a_month: "After a month"
  after_a_year: "After a year"
  after_days: "After %{count} days"
  # With the box empty, which is a state somebody passes through.
  after_unsaid: "After that long"
  # The words around the box.
  after: "After"
  day: "day"
  days_plain: "days"
  reaching_out: "Out to the network"
  reaching: "Talking to other servers"
  reaching_why: "Off, this server talks to nobody and everything happens between this machine and its own disk. On, the only two things that leave here are allowed: asking MusicBrainz and Wikimedia Commons for a photograph of each artist that has none, and passing what you listen to on to a scrobbling service, if you have set one up in your profile. Neither of them starts on its own."
  reaching_on: "Let it out"
  collection: "The collection"
  ignored_articles: "Articles that do not count"
  ignored_articles_why: "Words skipped when deciding which letter a name files under, separated by spaces, so that \"The Beatles\" sits under B."
  no_articles: "None"
  sessions: "Sessions"
  session_lifetime: "How long they last"
  session_lifetime_why: "Before the panel asks for a password again. The ones already open keep the day they were given."
  a_day: "A day"
  a_week: "A week"
  a_month: "A month"
  three_months: "Three months"
  days: "%{count} days"

prefs:
  lead: "How the panel looks and speaks to you. Kept with your account, so it follows you to another browser."
  theme: "Theme"
  accent: "Accent colour"
  language: "Language"
  language_auto: "Automatic"
  language_note: "Choosing one reloads the panel, which is what applies it."
  unsaved: "That is applied here, but the server did not keep it"

accent:
  blue: "Blue"
  teal: "Teal"
  green: "Green"
  amber: "Amber"
  crimson: "Crimson"
  plum: "Plum"

common:
  show: "Show"
  hide: "Hide"
  copy: Copy
  copied: Copied
  done: Done
  close: Close
  # The cross at the end of a search field, on every screen that has one. Said again
  # here rather than borrowed off `empty`, where the same words are a button in an
  # empty listing: that one is one screen's answer to having found nothing, and this
  # is what a search box does wherever there is one.
  clear_search: Clear the search
  # Quoted on both sides, and they have to stay that way. YAML reads yes, no, on
  # and off as booleans, in keys and in values alike, so `no: No` becomes the key
  # `false` holding the value `false` — which is what the panel then shows
  # somebody, in a column where it looks like a word.
  "yes": "Yes"
  "no": "No"
  saved: Saved
  refused: The server would not do that
  save: Save
  cancel: Cancel
  keep: Keep it
  loading: Loading…
  not_for_you: "This section is only for whoever administers the server."
  not_yet: Not built yet
  nothing_here: This section has a place in the panel and nothing in it yet.

# Where listens are passed on to, inside the profile's "Listening" block. Its own
# vocabulary rather than `keys`, though both ask for a secret: a key is one we give
# out and this is one somebody was given elsewhere.
listens:
  destinations: "Where they go"
  lead: "Besides counting them here, Tocata can pass what you listen to on to a scrobbling service. You can send to more than one. These take effect as you press them — there is nothing here to save."
  while_off: "Nothing is being sent while the switch above is off. What is waiting stays waiting, and goes as soon as you switch it back on."
  # The same, by a decision that is not yours: there is nothing here you can switch
  # on, and a destination cannot be added either, since setting one up means asking
  # the service about the token.
  while_shut: "Nothing can be sent and no destination can be added while this server is not allowed to talk to other servers."
  none: "You are not sending your listens anywhere."
  none_why: "Passing plays on is switched on, but a listen is queued for a destination: until there is one, nothing is being kept to send later."
  add: "Add a destination"
  actions: "Actions"
  at: "Send to %{name}"
  somewhere: "Send your listens somewhere"
  choose: "Choose one"
  sheet_lead: "The token is in your account's settings on the service. It is stored here and never shown again."
  service: "Service"
  address: "Address"
  address_hint: "The root of your instance, with nothing after it."
  insecure: "Not encrypted: the token will travel in clear over the network."
  token: "Token"
  token_hint: "We check it with the service before storing it."
  checking: "Checking…"
  refused: "The service says that token is no good."
  unchecked: "Stored, but the token could not be checked: the service is not answering. Listens will go as soon as it does."
  as: "as %{name}"
  paused: "paused"
  pause: "Pause"
  resume: "Resume"
  change_token: "Change the token"
  remove: "Remove"
  # The line under the name when something is waiting. Two keys because rust-i18n
  # interpolates and does not pluralise.
  up_to_date: "up to date"
  waiting: "%{count} waiting"
  oldest: "oldest %{when}"
