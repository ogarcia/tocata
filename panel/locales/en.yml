# Your own account. Deliberately not sharing a word with `accounts`, which is
# the administrator's vocabulary: the same field means a different thing when it
# is somebody else's, and one of the two changing is not the other changing.
profile:
  where_signed_in: "Where you are signed in"
  panel_sessions: "Panel sessions"
  api_keys: "API keys"
  reach: "Libraries you reach"
  reach_all: "All"
  reach_some: "%{some} of %{all}"
  this_session: "This session since"
  manage_access: "Manage keys and sessions"
  lately: "Lately"
  key_used: "Key \"%{name}\" used"
  key_never_used: "No key used yet"
  password_changed: "Password changed"
  confirm_with_password: "Confirm the changes with your current password"
  email: Email address
  listening: "Listening"
  mismatch: "The two passwords are not the same"
  new_password: New password
  profile_lead: "Who you are on this server."
  repeat_password: "Repeat the new password"
  role: "Role"
  save_changes: "Save the changes"
  scrobbling: Pass plays on to a scrobbling service
