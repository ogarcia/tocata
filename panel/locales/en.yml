common:
  copy: Copy
  copied: Copied
  done: Done
  # Quoted on both sides, and they have to stay that way. YAML reads yes, no, on
  # and off as booleans, in keys and in values alike, so `no: No` becomes the key
  # `false` holding the value `false` — which is what the panel then shows
  # somebody, in a column where it looks like a word.
  "yes": "Yes"
  "no": "No"
  saved: Saved
  refused: The server would not do that
  save: Save
  cancel: Cancel
  keep: Keep it
  loading: Loading…
  not_yet: Not built yet
  nothing_here: This section has a place in the panel and nothing in it yet.
