# La colección, en lista. Las dos formas de cada recuento están escritas porque
# rust-i18n interpola pero no pluraliza, y una colección de una sola pista es lo
# que ve quien prueba Tocata sobre un único directorio.
tracks:
  search: Buscar pistas
  title: Título
  artist: Artista
  album: Álbum
  genre: Género
  length: Duración
  # Detrás de quien la hizo, que es la línea de la fila con sitio para una coletilla.
  missing: falta el fichero
  one: Una pista
  many: "%{count} pistas"
  none_found: Aquí no hay nada que coincida con lo que has escrito.

# El panel de una pista, que se abre pulsando su fila. En singular a propósito: el
# bloque de arriba es la pantalla que las lista, este es la cosa en sí.
#
# Cada nombre de aquí etiqueta una fila que solo aparece si hay algo que poner en
# ella, así que ninguno se queda nunca encima de una raya.
track:
  said: Lo que dice
  words: Letra
  every_tag: "Todas las etiquetas · %{count}"
  the_recording: La grabación
  title: Título
  artist: Artista
  album: Álbum
  album_artist: Artista del álbum
  track: Pista
  # En su propia fila y no compartiéndola con la pista, porque la mayoría de los
  # discos salieron en uno solo y para ellos esta fila no existe.
  disc: Disco
  nth_of: "%{nth} de %{held}"
  year: Año
  genre: Género
  the_file: El fichero
  length: duración
  format: formato
  bitrate: bitrate
  # El que de los dos haya informado el fichero. Un MP3 no tiene profundidad de bits,
  # así que la mayoría de los ficheros de la mayoría de las colecciones son el primero.
  khz: kHz
  bits: bits
  khz_bits: kHz / bits
  where: Dónde está
  library: Biblioteca
  size_read: "Tamaño · leído"
  identifiers: Identificadores
  isrc: ISRC
  musicbrainz: MusicBrainz
  comment: Comentario
  # No está en los diseños, y el panel sería deshonesto sin ello: esta es justo la
  # fila de un listado que alguien abre porque algo va mal con ella.
  file_gone: Su fichero no está donde estaba, así que no hay nada que leer de él ni nada que reproducir.
  copy: Copiar
  # Lo bastante corto para una sola línea al lado de las acciones. Las tres frases de
  # este grupo van en el mismo sitio y dicen de dónde viene lo que estás leyendo, así
  # que si una parte en dos el pie cambia de alto al cambiar de pestaña.
  from_the_scan: Lo que el último escaneo leyó.
  from_the_file: Leído del fichero, no de la base de datos.
  from_beside: Leído de un fichero junto a la música.
  looked_in_both: Se ha buscado en el fichero y junto a él.
  # De dónde vino la letra, que es el sentido de mostrarla en un panel de
  # administración: una canción cuyo fichero al lado y cuya etiqueta no coinciden es
  # algo que conviene saber.
  beside_the_file: "De %{name}, junto a la música"
  in_the_frame: "Del marco %{frame} del fichero"
  timed: con tiempos
  untimed: sin tiempos
  one_line: 1 línea
  many_lines: "%{count} líneas"
  # Un tramo de la canción donde la letra no dice nada, y merece decirse: una fila en
  # blanco se lee como el final de la letra y no como una pausa dentro de ella.
  instrumental: Instrumental
  no_words: Este fichero no tiene letra.
  where_it_looked: Tocata lee los marcos de etiqueta del propio fichero y, si no hay nada, un .lrc o un .txt del mismo nombre junto a él. No mira en ningún otro sitio y no le pregunta a nadie.
  expected: Ha buscado
  # Ninguna fecha de cuándo miró por última vez, porque nada mira antes de que se lo
  # pidan. Que no hay escaneo que esperar es todo lo que dice esta frase.
  put_them_there: Pon la letra en cualquiera de los dos sitios y estará ahí la próxima vez que mires.
  as_written: "Todas las etiquetas que Tocata ha podido leer, escritas como las escribe %{kind}. No todo lo que hay en la etiqueta: un marco que este lector no conoce no llega siquiera, así que no hay forma de contar lo que se queda fuera."

# El panel de un disco. En singular, como el bloque de una pista: el plural de arriba
# es el estante que los lista.
album:
  the_album: El disco
  tracks: pistas
  length: duración
  year: año
  on_disc: en disco
  artist: Artista del álbum
  genre: Género
  label: Sello
  discs: Discos
  where: Dónde está
  library_read: "Biblioteca · leído"
  running_order: Pistas
  disc: "Disco %{nth}"
  a_title_opens_it: Un título abre lo que se sabe de esa pista.
  who_plays: Quién toca en él
  # Se dice porque no es una consulta ni una suposición: es la etiqueta de artista de
  # cada uno de sus ficheros, y por eso un disco puede listar gente que no sale en la
  # contraportada.
  from_the_tags: Sacado de las etiquetas de artista de sus propias pistas, no de una consulta.
  # Un fichero que ya no está, en su propia línea y no metido entre las cifras: un
  # disco al que le faltan cuatro ficheros no es un disco con cuatro pistas menos.
  one_gone: Uno de sus ficheros no está donde estaba. Sigue en el listado de abajo.
  many_gone: "%{count} de sus ficheros no están donde estaban. Siguen en el listado de abajo."
  pause_record: Pausar
  one_file: Un fichero en un directorio.
  many_files: "%{count} ficheros en un directorio."

albums:
  search: Buscar álbumes
  one: Un álbum
  many: "%{count} álbumes"
  none_found: Ningún disco coincide con lo que has escrito.
  playing: sonando

# El panel de un artista. El único de los tres que no tiene nada propio en disco: un
# artista no es un fichero ni un directorio, así que no hay ruta ni tamaño, y lo que
# merece mostrarse en su lugar es lo que suponen aquí.
artist:
  albums: álbumes
  tracks: pistas
  length: duración
  plays: escuchas
  genre: Género
  one_track_in: "1 pista en %{albums} álbumes"
  many_tracks_in: "%{count} pistas en %{albums} álbumes"
  played_most: Lo más escuchado
  # De quién son esas escuchas, que merece decirse en un servidor donde escucha más
  # gente.
  across_everyone: Contadas entre todos los que escuchan aquí, no solo tú.
  one_play: 1 escucha
  many_plays: "%{count} escuchas"
  records: Discos
  one_missing: falta 1
  many_missing: "faltan %{count}"
  play_everything: Reproducir todo
  # Qué quiere decir «suyos», y no es lo que decían los diseños: toda pista que les
  # acredite, colaboraciones incluidas, que es lo mismo que cuenta el listado.
  credited_on: Todos los discos en los que aparece acreditado.

artists:
  search: Buscar artistas
  one: Un artista
  many: "%{count} artistas"
  none_found: Nadie de aquí coincide con lo que has escrito.

genres:
  search: Buscar géneros
  one: Un género
  many: "%{count} géneros"
  none_found: Ningún género coincide con lo que has escrito.

# Lo que comparten los cuatro listados. Al pie de todos ellos, junto al glifo que
# gira, mientras viene algo de camino.
# Por qué un listado no tiene nada, que nunca es una sola respuesta. Cuatro estados que
# piden cuatro cosas distintas, y un «no hay resultados» sería el panel sabiendo cuál es
# y no diciéndolo.
empty:
  # Una búsqueda que ha estrechado demasiado. Tranquilizar importa más que la noticia:
  # lo que se teme es que la lista haya perdido algo, y no lo ha perdido.
  no_track_matches: Ninguna pista coincide con lo que has escrito.
  no_album_matches: Ningún disco coincide con lo que has escrito.
  no_artist_matches: Nadie coincide con lo que has escrito.
  no_genre_matches: Ningún género coincide con lo que has escrito.
  tracks_still_there: "Las %{count} pistas siguen ahí. Solo está estrechada la lista."
  albums_still_there: "Los %{count} discos siguen ahí. Solo está estrechada la lista."
  artists_still_there: "Los %{count} nombres siguen ahí. Solo está estrechada la lista."
  genres_still_there: "Los %{count} géneros siguen ahí. Solo está estrechada la lista."
  clear_the_search: Limpiar la búsqueda
  # Una colección con música y sin nada de este tipo, que es un hecho sobre las
  # etiquetas y no sobre la música. Nada que pulsar: el arreglo no está aquí.
  no_tracks: Nada tiene título.
  no_albums: Ningún fichero dice de qué disco es.
  no_artists: Ningún fichero dice quién lo hizo.
  no_genres: Ninguno de los ficheros dice lo que es.
  outside_tocata: Tocata lee lo que llevan los ficheros y no añade nada de su parte, así que esto es cosa de lo que los etiquetó. Arregla las etiquetas y el próximo escaneo lo recoge.
  tracks_read: Pistas leídas
  with_a_title: Con título
  with_an_album: Con etiqueta de álbum
  with_an_artist: Con etiqueta de artista
  with_a_genre: Con etiqueta de género
  # Hay música aquí y nada de ella es suya para verla.
  all_switched_off: Todas las bibliotecas están apagadas.
  switch_one_back_on: Hay música en este servidor y no se está leyendo nada, porque todas las bibliotecas que tiene están apagadas. Vuelve a encender una y aparece aquí; no hay que reescanear nada.
  nothing_you_reach: Aquí no hay nada que tú puedas ver.
  ask_an_administrator: Hay música en este servidor y a tu cuenta no se le ha dado ninguna biblioteca que pueda leer — o las que se le dieron están apagadas. Quien lleva el servidor puede cambiarlo.
  # El primer arranque, y el único estado vacío con algo que pulsar.
  nothing_yet: Todavía no se ha leído nada.
  nothing_added_yet: Todavía no se ha añadido nada a este servidor. Quien lo lleva añade una biblioteca y la escanea, y aparece aquí.
  no_libraries: Aún no hay bibliotecas. Una biblioteca es un directorio del que leer música, y no se lee nada hasta que haya una.
  one_library: "Hay una biblioteca, %{path}, y nunca se ha leído. Un escaneo la recorre y pone aquí lo que encuentre."
  many_libraries: "Hay %{count} bibliotecas y no se han leído todas. Un escaneo recorre lo que falta y pone aquí lo que encuentre."
  one_library_read: "Hay una biblioteca, %{path}, y al leerla no se encontró nada. O no apunta donde está la música, o lo que hay ahí no es audio que Tocata sepa leer."
  many_libraries_read: "Hay %{count} bibliotecas y al leerlas no se encontró nada. O no apuntan donde está la música, o lo que hay en ellas no es audio que Tocata sepa leer."
  scan_now: Escanear ahora
  scanning: Escaneando…

collection:
  stopped_at: "No se ha podido leer más allá de las %{shown} primeras."
  try_again: Volver a intentarlo
  reading: "Trayendo más · %{shown} de %{total}"
  # Cuánto hay de algo, en las dos cosas en que se cuenta una colección. En la
  # tercera línea de un disco y al final de la fila de un artista.
  one_track: "1 pista"
  many_tracks: "%{count} pistas"
  one_album: "1 álbum"
  many_albums: "%{count} álbumes"

# El reproductor al pie de la barra, y los botones que lo llenan.
player:
