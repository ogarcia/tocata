common:
  copy: Copiar
  copied: Copiada
  done: Hecho
  # Quoted on both sides, and they have to stay that way. YAML reads yes, no, on
  # and off as booleans, in keys and in values alike, so `no: No` becomes the key
  # `false` holding the value `false` — which is what the panel then shows
  # somebody, in a column where it looks like a word.
  "yes": "Sí"
  "no": "No"
  saved: Guardado
  refused: El servidor no lo permitió
  save: Guardar
  cancel: Cancelar
  keep: Dejarla estar
  loading: Cargando…
  not_yet: Todavía sin construir
  nothing_here: Esta sección tiene su sitio en el panel y nada dentro todavía.
