[package]
name = "tocata-panel"
description = "Tocata's administration panel"
# Nothing to publish: it is compiled to WebAssembly and carried inside the
# server's binary, not installed from a registry.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
console_error_panic_hook = "0.1"
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
rust-i18n = "4"
serde.workspace = true
send_wrapper = "0.6"
serde_json = "1"
# Only for the shapes on the wire; everything that needs a database or a socket
# stays behind the feature this switches off.
tocata = { path = "../server", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Clipboard", "DomRect", "EventSource", "HtmlAudioElement", "HtmlElement", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "MessageEvent", "Navigator", "RequestCredentials", "Storage", "SubmitEvent", "Window"] }
