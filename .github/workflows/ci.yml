name: CI

on:
  push:
    branches: [master]
    # The website has a workflow of its own, and nothing it says is checked by a
    # compiler: a change to it need not compile the server, build the panel and
    # publish an image identical to the one already published. Only on `push` —
    # a required check that is skipped on a pull request never reports at all,
    # and a branch waiting for it waits for ever.
    paths-ignore: ['website/**']
  pull_request:

# A newer push makes the run before it beside the point.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned: the panel's build tool decides what the bundle looks like.
  TRUNK_VERSION: 0.21.14

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-check-${{ hashFiles('Cargo.lock') }}
          # A changed lock file need not mean starting from nothing: most of what
          # was compiled last time is still what this time wants.
          restore-keys: cargo-check-

      # The server carries the panel inside its binary, so the panel is built
      # first or there is nothing to carry.
      - run: rustup target add wasm32-unknown-unknown

      # Trunk fetches wasm-bindgen and wasm-opt itself on first use, which is
      # the one thing in this build that reaches the network without being
      # pinned. Caching that directory is what keeps a run from downloading them
      # again, and what keeps two runs a month apart from getting different
      # tools.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ runner.arch }}-${{ env.TRUNK_VERSION }}

      # Straight from the release, at a version we chose, rather than through a
      # third party action that would decide for us what "latest" means today.
      - name: Install trunk
        run: |
          case "${{ runner.arch }}" in
            X64)   arch=x86_64 ;;
            ARM64) arch=aarch64 ;;
            *) echo "no trunk build for ${{ runner.arch }}" >&2; exit 1 ;;
          esac
          url="https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION"
          name="trunk-$arch-unknown-linux-musl.tar.gz"
          curl -fsSL "$url/$name" -o trunk.tar.gz
          curl -fsSL "$url/$name.sha256" -o trunk.sha256
          # The name inside the checksum file is the one it was published under.
          echo "$(cut -d' ' -f1 trunk.sha256)  trunk.tar.gz" | sha256sum --check
          tar -xzf trunk.tar.gz -C /usr/local/bin trunk
          rm trunk.tar.gz trunk.sha256

      - run: trunk build --release
        working-directory: panel

      # The first two are what the pre-commit hook already refuses to commit
      # without. The third is the part the hook leaves to us, so that a local
      # commit stays quick.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked

  binary:
    name: Static binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One architecture failing is worth knowing about on its own.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7

      # libsqlite3-sys compiles SQLite itself and the runner's own gcc targets
      # glibc; musl-gcc is what the cc crate looks for instead. Rust code needs
      # nothing extra, since the toolchain brings its own musl.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - run: rustup target add ${{ matrix.target }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      # The server carries the panel inside its binary, so the panel is built
      # first or there is nothing to carry.
      - run: rustup target add wasm32-unknown-unknown

      # Trunk fetches wasm-bindgen and wasm-opt itself on first use, which is
      # the one thing in this build that reaches the network without being
      # pinned. Caching that directory is what keeps a run from downloading them
      # again, and what keeps two runs a month apart from getting different
      # tools.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ runner.arch }}-${{ env.TRUNK_VERSION }}

      # Straight from the release, at a version we chose, rather than through a
      # third party action that would decide for us what "latest" means today.
      - name: Install trunk
        run: |
          case "${{ runner.arch }}" in
            X64)   arch=x86_64 ;;
            ARM64) arch=aarch64 ;;
            *) echo "no trunk build for ${{ runner.arch }}" >&2; exit 1 ;;
          esac
          url="https://github.com/trunk-rs/trunk/releases/download/v$TRUNK_VERSION"
          name="trunk-$arch-unknown-linux-musl.tar.gz"
          curl -fsSL "$url/$name" -o trunk.tar.gz
          curl -fsSL "$url/$name.sha256" -o trunk.sha256
          # The name inside the checksum file is the one it was published under.
          echo "$(cut -d' ' -f1 trunk.sha256)  trunk.tar.gz" | sha256sum --check
          tar -xzf trunk.tar.gz -C /usr/local/bin trunk
          rm trunk.tar.gz trunk.sha256

      - run: trunk build --release
        working-directory: panel

      # Static linking is the musl target's own default, so no flag asks for it
      # here either.
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check that it brought its own libc
        run: |
          binary=target/${{ matrix.target }}/release/tocata
          file "$binary"
          if readelf -l "$binary" | grep -q INTERP; then
            echo "tocata is not statically linked" >&2
            exit 1
          fi

      # Named for the architecture the way the container build says it, which is
      # what the Containerfile reads and one vocabulary fewer to translate.
      - uses: actions/upload-artifact@v7
        with:
          name: tocata-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/tocata
          if-no-files-found: error

  image:
    name: Container image
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For pushing to GHCR, which needs nothing else configured: the token the
      # run already has is the credential.
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: tocata-amd64
          path: amd64
      - uses: actions/download-artifact@v8
        with:
          name: tocata-arm64
          path: arm64

      - name: Lay the binaries out where the Containerfile looks
        run: |
          mkdir dist
          mv amd64/tocata dist/tocata-amd64
          mv arm64/tocata dist/tocata-arm64

      # Emulation is for one thing only: the arm64 image adds its user and its
      # directories, and that is shell that has to run. No compiler goes near it.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # A branch name may carry a slash; an image tag may not.
      - name: Work out the tag
        run: echo "TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      # No compiler runs in this job: it wraps the binaries the job before it
      # made, which is the path a release will take and therefore the one worth
      # exercising on every push. Loaded rather than pushed, because a
      # multi-platform image cannot be handed to the local daemon and because
      # there is nothing to publish until this one has answered.
      - name: Build for this machine
        run: |
          docker buildx build \
            --build-arg BINARY_SOURCE=prebuilt \
            --platform linux/amd64 \
            --load --tag tocata:ci .

      # An image that builds and an image that serves music are different
      # claims. This one starts, creates its database, and answers a call that
      # needed the password it printed a second earlier.
      - name: Start it and ask it something
        run: |
          docker run --detach --name tocata --publish 4224:4224 tocata:ci
          # Waiting on the health check rather than on /rest, which answers 200
          # even when it is refusing the request, and so cannot say no.
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4224/api/health && break
            sleep 1
          done
          docker logs tocata > log.txt 2>&1
          cat log.txt
          password="$(sed -n "s/.*initial password for 'admin': //p" log.txt)"
          test -n "$password"
          curl -sf "http://127.0.0.1:4224/rest/ping?u=admin&p=$password&v=1.16.1&c=ci&f=json" \
            | tee /dev/stderr \
            | grep -q '"status":"ok"'

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures under one manifest, tagged with the branch it came
      # from, and only once the amd64 build of it has served a request. A pull
      # request builds and gets tested; it does not publish.
      - name: Publish
        if: github.event_name == 'push'
        run: |
          docker buildx build \
            --build-arg BINARY_SOURCE=prebuilt \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --platform linux/amd64,linux/arm64 \
            --push --tag "ghcr.io/${{ github.repository }}:$TAG" .
