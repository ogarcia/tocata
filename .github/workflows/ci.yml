name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push makes the run before it beside the point.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-check-${{ hashFiles('Cargo.lock') }}
          # A changed lock file need not mean starting from nothing: most of what
          # was compiled last time is still what this time wants.
          restore-keys: cargo-check-

      # The first two are what the pre-commit hook already refuses to commit
      # without. The third is the part the hook leaves to us, so that a local
      # commit stays quick.
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --locked

  binary:
    name: Static binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One architecture failing is worth knowing about on its own.
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      # libsqlite3-sys compiles SQLite itself and the runner's own gcc targets
      # glibc; musl-gcc is what the cc crate looks for instead. Rust code needs
      # nothing extra, since the toolchain brings its own musl.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - run: rustup target add ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      # Static linking is the musl target's own default, so no flag asks for it
      # here either.
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check that it brought its own libc
        run: |
          binary=target/${{ matrix.target }}/release/tocata
          file "$binary"
          if readelf -l "$binary" | grep -q INTERP; then
            echo "tocata is not statically linked" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tocata-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/tocata
          if-no-files-found: error

  image:
    name: Container image
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # versions.env is plain KEY=value so that this is all it takes to make the
      # same file the source of truth here too.
      - run: cat versions.env >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: tocata-x86_64
          path: dist

      # No compiler runs in this job: it wraps the binary the job before it made,
      # which is the path a release will take and therefore the one worth
      # exercising on every push.
      - name: Build
        run: |
          docker build \
            --build-arg ALPINE_VERSION="$ALPINE_VERSION" \
            --build-arg RUST_VERSION="$RUST_VERSION" \
            --build-arg BINARY_SOURCE=prebuilt \
            --tag tocata:ci .

      # An image that builds and an image that serves music are different
      # claims. This one starts, creates its database, and answers a call that
      # needed the password it printed a second earlier.
      - name: Start it and ask it something
        run: |
          docker run --detach --name tocata --publish 4040:4040 tocata:ci
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:4040/rest/ping && break
            sleep 1
          done
          docker logs tocata > log.txt 2>&1
          cat log.txt
          password="$(sed -n "s/.*initial password for 'admin': //p" log.txt)"
          test -n "$password"
          curl -sf "http://127.0.0.1:4040/rest/ping?u=admin&p=$password&v=1.16.1&c=ci&f=json" \
            | tee /dev/stderr \
            | grep -q '"status":"ok"'
